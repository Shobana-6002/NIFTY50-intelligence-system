name: Daily NIFTY 50 Data Update

on:
  schedule:
    - cron: "30 12 * * 1-5"
    # 12:30 UTC = 6:00 PM IST
    # runs Monday to Friday only

  workflow_dispatch:
    # allows manual trigger from GitHub UI
    # useful for testing

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - checkout your repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - set up Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3 - install uv
      - name: Install UV
        run: pip install uv

      # Step 4 - install dependencies using uv
      - name: Install Dependencies
        run: uv pip install --system pandas numpy yfinance

      # Step 5 - run your update script
      - name: Run Data Update
        run: python update_data.py

      # Step 6 - commit and push updated CSVs
      - name: Commit Updated Data
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions Bot"
          git add data/processed/
          git diff --staged --quiet || git commit -m "Daily data update - $(date '+%Y-%m-%d')"
          git push
